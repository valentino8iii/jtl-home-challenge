name: Benchmark Dual VN VPS Ingress

on:
  workflow_dispatch:
    inputs:
      vps1_ip:
        description: 'First VN VPS IP'
        required: true
        default: '160.250.26.86'
      vps2_ip:
        description: 'Second VN VPS IP'
        required: true
        default: '103.144.87.132'
      port:
        description: 'iperf3 Server Port (-p)'
        required: false
        default: '5201'
      streams:
        description: 'Parallel TCP Streams (-P)'
        required: true
        default: '8'
      duration:
        description: 'Test Duration in seconds (-t)'
        required: true
        default: '30'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iperf3 jq

      - name: Inspect Runner Origin
        run: |
          echo "Detecting GitHub runner public IP and egress location..."
          curl -s --max-time 5 https://ipinfo.io/json > runner_info.json || echo "{}" > runner_info.json

      - name: Test VPS 1
        run: |
          echo "Testing VPS 1: ${{ github.event.inputs.vps1_ip || '160.250.26.86' }} on port ${{ github.event.inputs.port || '5201' }}..."
          iperf3 -c "${{ github.event.inputs.vps1_ip || '160.250.26.86' }}" \
                 -p "${{ github.event.inputs.port || '5201' }}" \
                 -P "${{ github.event.inputs.streams || '8' }}" \
                 -t "${{ github.event.inputs.duration || '30' }}" \
                 --connect-timeout 10000 \
                 -J > vps1_results.json 2> vps1_stderr.log || true

      - name: Buffer Cooldown
        run: |
          echo "Waiting 10s for TCP connections to tear down..."
          sleep 10

      - name: Test VPS 2
        run: |
          echo "Testing VPS 2: ${{ github.event.inputs.vps2_ip || '103.144.87.132' }} on port ${{ github.event.inputs.port || '5201' }}..."
          iperf3 -c "${{ github.event.inputs.vps2_ip || '103.144.87.132' }}" \
                 -p "${{ github.event.inputs.port || '5201' }}" \
                 -P "${{ github.event.inputs.streams || '8' }}" \
                 -t "${{ github.event.inputs.duration || '30' }}" \
                 --connect-timeout 10000 \
                 -J > vps2_results.json 2> vps2_stderr.log || true

      - name: Generate Comparison Summary
        env:
          VPS1_IP: ${{ github.event.inputs.vps1_ip || '160.250.26.86' }}
          VPS2_IP: ${{ github.event.inputs.vps2_ip || '103.144.87.132' }}
          PORT: ${{ github.event.inputs.port || '5201' }}
          STREAMS: ${{ github.event.inputs.streams || '8' }}
          DURATION: ${{ github.event.inputs.duration || '30' }}
        run: python3 .github/scripts/generate_report.py

      - name: Upload Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vps-ingress-benchmark-results
          path: |
            vps1_results.json
            vps2_results.json
            vps1_stderr.log
            vps2_stderr.log
            runner_info.json
          if-no-files-found: ignore