name: Benchmark Dual VN VPS Ingress & Egress

on:
  workflow_dispatch:
    inputs:
      vps1_ip:
        description: 'First VN VPS IP'
        required: true
        default: '160.250.26.86'
      vps2_ip:
        description: 'Second VN VPS IP'
        required: true
        default: '103.144.87.132'
      routing_mode:
        description: 'Ingress Routing / VPN Mode'
        required: true
        type: choice
        options:
          - 'Cloudflare WARP (Global Anycast)'
          - 'Direct (GitHub Runner / Azure)'
          - 'WireGuard VPN (Asia - requires WG_ASIA_CONF secret)'
          - 'WireGuard VPN (Europe - requires WG_EUROPE_CONF secret)'
          - 'WireGuard VPN (US - requires WG_US_CONF secret)'
          - 'WireGuard VPN (Vietnam - requires WG_VN_CONF secret)'
        default: 'Cloudflare WARP (Global Anycast)'
      port:
        description: 'iperf3 Server Port (-p)'
        required: false
        default: '5201'
      streams:
        description: 'Parallel TCP Streams (-P)'
        required: true
        default: '8'
      duration:
        description: 'Test Duration per test in seconds (-t)'
        required: true
        default: '30'

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iperf3 jq

      - name: Setup Cloudflare WARP
        if: ${{ startsWith(github.event.inputs.routing_mode, 'Cloudflare WARP') }}
        run: |
          echo "Installing Cloudflare WARP client..."
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-warp.list
          sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/cloudflare-warp.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y cloudflare-warp
          echo "Starting warp-svc..."
          sudo systemctl start warp-svc || true
          sleep 2
          echo "Registering WARP client..."
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode warp || true
          warp-cli --accept-tos connect || true
          sleep 4
          warp-cli --accept-tos status || true
          echo "Fetching Cloudflare trace..."
          curl -s --max-time 5 https://www.cloudflare.com/cdn-cgi/trace > warp_trace.txt || true
          cat warp_trace.txt

      - name: Setup WireGuard VPN
        if: ${{ startsWith(github.event.inputs.routing_mode, 'WireGuard') }}
        env:
          WG_VN_CONF: ${{ secrets.WG_VN_CONF }}
          WG_ASIA_CONF: ${{ secrets.WG_ASIA_CONF }}
          WG_EUROPE_CONF: ${{ secrets.WG_EUROPE_CONF }}
          WG_US_CONF: ${{ secrets.WG_US_CONF }}
          MODE: ${{ github.event.inputs.routing_mode }}
        run: |
          sudo apt-get install -y wireguard wireguard-tools
          CONF=""
          if [[ "$MODE" == *"Vietnam"* ]] && [[ -n "$WG_VN_CONF" ]]; then
            CONF="$WG_VN_CONF"
          elif [[ "$MODE" == *"Asia"* ]] && [[ -n "$WG_ASIA_CONF" ]]; then
            CONF="$WG_ASIA_CONF"
          elif [[ "$MODE" == *"Europe"* ]] && [[ -n "$WG_EUROPE_CONF" ]]; then
            CONF="$WG_EUROPE_CONF"
          elif [[ "$MODE" == *"US"* ]] && [[ -n "$WG_US_CONF" ]]; then
            CONF="$WG_US_CONF"
          fi

          if [[ -n "$CONF" ]]; then
            echo "$CONF" | sudo tee /etc/wireguard/wg0.conf >/dev/null
            sudo chmod 600 /etc/wireguard/wg0.conf
            sudo wg-quick up wg0
            echo "WireGuard tunnel is UP!"
            echo "=== WireGuard Interface Status ==="
            sudo wg show
            sudo wg show > wg_status.txt 2>&1 || true
          else
            echo "::warning::Selected $MODE, but the corresponding GitHub Secret (WG_*_CONF) is not configured. Falling back to direct connection."
          fi

      - name: Inspect Runner Origin
        run: |
          echo "Detecting runner public IP and egress location..."
          echo "{}" > runner_info.json
          for url in \
            "http://ip-api.com/json" \
            "https://ipinfo.io/json" \
            "https://ifconfig.co/json"
          do
            echo "Checking egress info via $url..."
            if curl -s --connect-timeout 4 --max-time 8 "$url" > temp_info.json && grep -q -E '"ip"|"query"' temp_info.json; then
              cp temp_info.json runner_info.json
              echo "Egress location detected successfully:"
              cat runner_info.json
              echo ""
              break
            fi
          done
          if ! grep -q -E '"ip"|"query"' runner_info.json; then
            echo "JSON Geo APIs timed out or rate-limited. Trying plaintext IP services..."
            RAW_IP=$(curl -s --connect-timeout 3 --max-time 5 https://icanhazip.com || curl -s --connect-timeout 3 --max-time 5 https://ifconfig.me || echo "")
            if [ -n "$RAW_IP" ]; then
              echo "{\"ip\": \"$RAW_IP\"}" > runner_info.json
              echo "Public IP detected: $RAW_IP"
            fi
          fi

      # --- VPS 1 TESTS ---
      - name: Test VPS 1 Ingress
        run: |
          echo "Testing VPS 1 Ingress (Runner -> VPS) on port ${{ github.event.inputs.port || '5201' }}..."
          iperf3 -c "${{ github.event.inputs.vps1_ip }}" \
                 -p "${{ github.event.inputs.port || '5201' }}" \
                 -P "${{ github.event.inputs.streams }}" \
                 -t "${{ github.event.inputs.duration }}" \
                 --connect-timeout 10000 \
                 -J > vps1_ingress.json 2> vps1_ingress_stderr.log || true

      - name: Cooldown
        run: |
          echo "Waiting 5s before reverse egress test..."
          sleep 5

      - name: Test VPS 1 Egress
        run: |
          echo "Testing VPS 1 Egress (VPS -> Runner via -R) on port ${{ github.event.inputs.port || '5201' }}..."
          iperf3 -c "${{ github.event.inputs.vps1_ip }}" \
                 -p "${{ github.event.inputs.port || '5201' }}" \
                 -P "${{ github.event.inputs.streams }}" \
                 -t "${{ github.event.inputs.duration }}" \
                 --connect-timeout 10000 \
                 -R \
                 -J > vps1_egress.json 2> vps1_egress_stderr.log || true

      - name: Buffer Cooldown
        run: |
          echo "Waiting 10s for TCP connections to tear down before testing VPS 2..."
          sleep 10

      # --- VPS 2 TESTS ---
      - name: Test VPS 2 Ingress
        run: |
          echo "Testing VPS 2 Ingress (Runner -> VPS) on port ${{ github.event.inputs.port || '5201' }}..."
          iperf3 -c "${{ github.event.inputs.vps2_ip }}" \
                 -p "${{ github.event.inputs.port || '5201' }}" \
                 -P "${{ github.event.inputs.streams }}" \
                 -t "${{ github.event.inputs.duration }}" \
                 --connect-timeout 10000 \
                 -J > vps2_ingress.json 2> vps2_ingress_stderr.log || true

      - name: Cooldown
        run: |
          echo "Waiting 5s before reverse egress test..."
          sleep 5

      - name: Test VPS 2 Egress
        run: |
          echo "Testing VPS 2 Egress (VPS -> Runner via -R) on port ${{ github.event.inputs.port || '5201' }}..."
          iperf3 -c "${{ github.event.inputs.vps2_ip }}" \
                 -p "${{ github.event.inputs.port || '5201' }}" \
                 -P "${{ github.event.inputs.streams }}" \
                 -t "${{ github.event.inputs.duration }}" \
                 --connect-timeout 10000 \
                 -R \
                 -J > vps2_egress.json 2> vps2_egress_stderr.log || true

      - name: Generate Comparison Summary
        env:
          VPS1_IP: ${{ github.event.inputs.vps1_ip }}
          VPS2_IP: ${{ github.event.inputs.vps2_ip }}
          PORT: ${{ github.event.inputs.port || '5201' }}
          STREAMS: ${{ github.event.inputs.streams }}
          DURATION: ${{ github.event.inputs.duration }}
          ROUTING_MODE: ${{ github.event.inputs.routing_mode }}
        run: python3 .github/scripts/generate_report.py

      - name: Upload Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vps-benchmark-results
          path: |
            vps1_ingress.json
            vps1_egress.json
            vps2_ingress.json
            vps2_egress.json
            vps1_ingress_stderr.log
            vps1_egress_stderr.log
            vps2_ingress_stderr.log
            vps2_egress_stderr.log
            runner_info.json
            warp_trace.txt
            wg_status.txt
          if-no-files-found: ignore