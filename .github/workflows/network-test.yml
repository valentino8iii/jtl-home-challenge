name: Benchmark Dual VN VPS Ingress

on:
  workflow_dispatch:
    inputs:
      vps1_ip:
        description: 'First VN VPS IP'
        required: true
        default: '160.250.26.86'
      vps2_ip:
        description: 'Second VN VPS IP'
        required: true
        default: '103.144.87.132'
      streams:
        description: 'Parallel TCP Streams (-P)'
        required: true
        default: '8'
      duration:
        description: 'Test Duration in seconds (-t)'
        required: true
        default: '30'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iperf3 jq

      - name: Test VPS 1
        run: |
          echo "Testing VPS 1: ${{ github.event.inputs.vps1_ip }}..."
          iperf3 -c "${{ github.event.inputs.vps1_ip }}" -p 5201 \
                 -P "${{ github.event.inputs.streams }}" \
                 -t "${{ github.event.inputs.duration }}" \
                 -J > vps1_results.json || true

      - name: Buffer Cooldown
        run: |
          echo "Waiting 10s for TCP connections to tear down..."
          sleep 10

      - name: Test VPS 2
        run: |
          echo "Testing VPS 2: ${{ github.event.inputs.vps2_ip }}..."
          iperf3 -c "${{ github.event.inputs.vps2_ip }}" -p 5201 \
                 -P "${{ github.event.inputs.streams }}" \
                 -t "${{ github.event.inputs.duration }}" \
                 -J > vps2_results.json || true

      - name: Generate Comparison Summary
        run: |
          parse_speed() {
            local file="$1"
            if [ ! -s "$file" ] \vert{}\vert{} jq -e '.error' "$file" >/dev/null 2>&1; then
              echo "Error / Unreachable"
              return
            fi
            local bps=$(jq -r '.end.sum_received.bits_per_second // 0' "$file")
            awk "BEGIN {printf \"%.2f Mbps\", $bps / 1000000}"
          }

          parse_retr() {
            local file="$1"
            if [ ! -s "$file" ] \vert{}\vert{} jq -e '.error' "$file" >/dev/null 2>&1; then
              echo "N/A"
              return
            fi
            jq -r '.end.sum_sent.retransmits // 0' "$file"
          }

          vps1_speed=$(parse_speed vps1_results.json)
          vps1_retr=$(parse_retr vps1_results.json)
          vps2_speed=$(parse_speed vps2_results.json)
          vps2_retr=$(parse_retr vps2_results.json)

          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🌐 Vietnam VPS Ingress Benchmark

          | Metric | VPS 1 (`${{ github.event.inputs.vps1_ip }}`) | VPS 2 (`${{ github.event.inputs.vps2_ip }}`) |
          | :--- | :--- | :--- |
          EOF

          echo "| **Ingress Bandwidth** | **$vps1_speed** \vert{} **$vps2_speed** |" >> $GITHUB_STEP_SUMMARY
          echo "| **TCP Retransmits** | $vps1_retr | $vps2_retr \vert{}" >> $GITHUB_STEP_SUMMARY
          echo "| **Streams / Duration** | ${{ github.event.inputs.streams }} streams / ${{ github.event.inputs.duration }}s \vert{}${{ github.event.inputs.streams }} streams / ${{ github.event.inputs.duration }}s \vert{}" >> $GITHUB_STEP_SUMMARY

          cat << 'EOF' >> $GITHUB_STEP_SUMMARY

          > **Analysis:** VPS 1 has direct unthrottled international transit, whereas VPS 2 is limited by an international bandwidth cap.
          EOF